<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>7 Steps to Win · Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: mirrors the seller app. Top bar with stepper, step cards row, sales stage band, then manager tools (funnel diagnostic, team check, week). Step pages open by hash. */
:root{
  --bg:#F6F8FC; --panel:#FFFFFF; --band:#EEF2FB; --line:#E3E8F0; --line2:#C9D0DC;
  --ink:#17233B; --body:#3D4451; --muted:#667085;
  --navy:#1837A3; --navy-d:#10267A;
  --focus:#C2412D; --focus-s:#FCEDEA; --build:#A86400; --build-s:#FDF3E2; --strong:#2F7D3A; --strong-s:#E8F4EA;
  --tmix:88%; --smix:9%;
  --shadow:0 1px 2px rgba(23,35,59,.06),0 4px 14px rgba(23,35,59,.06);
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1522;--panel:#161E2E;--band:#1B2540;--line:#26314A;--line2:#36435F;
  --ink:#E8EDF7;--body:#C3CBDA;--muted:#8D97AB;--navy:#7D98F2;--navy-d:#A9BCF7;
  --focus:#F08A76;--focus-s:#3A1F1C;--build:#E2B05A;--build-s:#33280F;--strong:#7CC489;--strong-s:#17301C;
  --tmix:55%;--smix:16%;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1522;--panel:#161E2E;--band:#1B2540;--line:#26314A;--line2:#36435F;
  --ink:#E8EDF7;--body:#C3CBDA;--muted:#8D97AB;--navy:#7D98F2;--navy-d:#A9BCF7;
  --focus:#F08A76;--focus-s:#3A1F1C;--build:#E2B05A;--build-s:#33280F;--strong:#7CC489;--strong-s:#17301C;
  --tmix:55%;--smix:16%;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--body);font-family:var(--sans);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
h1,h2,h3{color:var(--ink);margin:0;text-wrap:balance}
h1{font-size:clamp(26px,3.6vw,34px);font-weight:700;letter-spacing:-.01em}
h2{font-size:20px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
a{color:var(--navy)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.inner{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.top .inner{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;font-weight:600;white-space:nowrap}
.brand .tag{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--navy);border-radius:999px;padding:3px 9px}
.stepper{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.sp{display:flex;align-items:center;gap:7px;text-decoration:none;padding:4px 10px 4px 4px;border-radius:999px;color:var(--muted);font-size:13px;white-space:nowrap}
.sp:hover,.sp.on{background:var(--band);color:var(--ink)}
.sp b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--on,#fff);font-size:11px}
.tools{display:flex;gap:6px}
.tbtn{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line2);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;text-decoration:none;white-space:nowrap}
.tbtn:hover{border-color:var(--navy);color:var(--navy)}

main{padding-block:28px 48px;display:grid;gap:28px}
.hero{display:grid;gap:10px}
.hero p{max-width:66ch;color:var(--body);font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font:inherit;font-size:13px;border:1px solid var(--line2);background:var(--panel);color:var(--body);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* step cards */
.cards{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px;padding-top:24px}
@media (max-width:1150px){.cards{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:36px}}
@media (max-width:620px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{--s:color-mix(in srgb,var(--c) var(--smix),var(--panel));--t:color-mix(in srgb,var(--c) var(--tmix),var(--ink));
  position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;text-decoration:none;color:var(--body);
  background:var(--s);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:30px 12px 14px;transition:transform .18s,box-shadow .18s,opacity .2s;min-width:0}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card.dim{opacity:.32}
.card .num{position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:var(--c);color:var(--on,#fff);font-weight:700;font-size:18px;display:grid;place-items:center;border:3px solid var(--panel);box-shadow:0 2px 6px rgba(23,35,59,.15)}
.card .sub{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t);margin-bottom:2px}
.card .name{color:var(--t);font-size:16px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;margin-bottom:6px}
.card .desc{font-size:13px;line-height:1.4}
.card .metric{border-top:1px solid color-mix(in srgb,var(--ink) 12%,transparent);margin-top:auto;padding-top:9px;width:100%;display:grid;gap:2px}
.card .metric .m{font-size:13px;font-weight:600;color:var(--ink)}
.card .metric .q{font-size:12px;color:var(--muted);font-style:italic}
.card .gap{margin-top:8px;font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--focus-s);color:var(--focus)}
.card .open{margin-top:10px;font-size:12px;font-weight:600;color:var(--t)}
.band{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px}
@media (max-width:1150px){.band{grid-template-columns:1fr 1fr 1fr}}
.band div{background:var(--band);color:var(--navy-d);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;border-radius:8px}
@media (min-width:1151px){.band .b1{grid-column:1/6}.band .b2{grid-column:6/8}.band .b3{grid-column:8/9}}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:18px;min-width:0}
.panel-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.panel-head p{color:var(--muted);font-size:14px;max-width:62ch;margin-top:4px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:860px){.duo{grid-template-columns:1fr}}
select,input[type=text],input[type=number],textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}

/* funnel */
.funnel{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:860px){.funnel{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.funnel{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fbox{display:grid;gap:4px}
.fbox label{font-size:12px;color:var(--muted);font-weight:500}
.fbox input{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px}
.conv{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line2)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
td input{width:72px;padding:4px 6px;font-family:var(--mono)}
.bar{height:8px;border-radius:4px;background:var(--line);position:relative;min-width:110px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--c)}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);text-decoration:none}
.st{font-size:11px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.st.good{background:var(--strong-s);color:var(--strong)}.st.mid{background:var(--build-s);color:var(--build)}.st.bad{background:var(--focus-s);color:var(--focus)}
.callout{border-left:4px solid var(--focus);background:var(--focus-s);border-radius:0 10px 10px 0;padding:12px 14px;color:var(--ink);font-size:14px}
.callout a{font-weight:600}

/* team check */
.tc{overflow-x:auto}
.tc table{min-width:760px}
.tc th.stp{text-align:center}
.tc td{text-align:center;padding:6px}
.tc td:first-child{text-align:left;white-space:nowrap;color:var(--ink);font-weight:500}
.cell{font:inherit;font-size:12px;font-weight:600;width:100%;min-width:78px;border:1px solid var(--line);border-radius:7px;padding:6px 4px;cursor:pointer;background:var(--panel);color:var(--muted)}
.cell.s3{background:var(--strong-s);color:var(--strong);border-color:transparent}
.cell.s2{background:var(--build-s);color:var(--build);border-color:transparent}
.cell.s1{background:var(--focus-s);color:var(--focus);border-color:transparent}
.legend{display:flex;gap:8px;flex-wrap:wrap}
.rm{font:inherit;border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px}
.rm:hover{color:var(--focus)}

/* week */
.week{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.week{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.week{grid-template-columns:1fr}}
.wk{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:6px;align-content:start}
.wk p{font-size:14px}

/* step page */
.shead{--t:color-mix(in srgb,var(--c) var(--tmix),var(--ink));background:color-mix(in srgb,var(--c) var(--smix),var(--panel));border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;padding:22px;display:grid;gap:10px}
.shead .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.shead .num{width:48px;height:48px;border-radius:50%;background:var(--c);color:var(--on,#fff);font-weight:700;font-size:20px;display:grid;place-items:center;flex:0 0 48px}
.shead h1{color:var(--t);text-transform:uppercase;letter-spacing:.02em}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:760px){.kv{grid-template-columns:1fr}}
.kv>div{display:grid;gap:4px;align-content:start}
.kv p{color:var(--ink)}
.sgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.sgrid{grid-template-columns:minmax(0,1fr)}}
ul.list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.list li{padding-left:18px;position:relative}
ul.list li::before{content:"";position:absolute;left:2px;top:.6em;width:7px;height:7px;border-radius:2px;background:var(--line2)}
ul.flags li::before{background:var(--focus)}
ul.steps li::before{background:var(--strong)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink)}
.check:hover{background:var(--band)}
.check input{width:18px;height:18px;accent-color:var(--navy);margin-top:2px;flex:0 0 18px}
.check small{display:block;color:var(--muted);font-size:13px}
.qbtn{font:inherit;font-size:14px;text-align:left;width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.qbtn:hover{border-color:var(--navy)}
.qbtn span:last-child{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;flex:0 0 auto}
.qbtn.copied span:last-child{color:var(--strong)}
.stack{display:grid;gap:8px}
.score{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.score .big{font-family:var(--mono);font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums}
.btn{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--navy);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--ink)}
pre.recap{white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;margin:0;background:var(--band);border-radius:8px;padding:12px;max-height:300px;overflow:auto;color:var(--ink)}
.toast{font-size:13px;color:var(--strong);font-weight:600;min-height:1.2em}
.nav2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
footer{color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
/* deal doctor */
.sym{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:900px){.sym{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.sym{grid-template-columns:1fr}}
.symt{display:grid;gap:4px;align-content:start;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--body);transition:border-color .15s,transform .15s}
.symt:hover{border-color:var(--navy);transform:translateY(-1px)}
.symt b{color:var(--ink);font-size:15px}
.symt span{font-size:13px;color:var(--muted)}
.dots{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.dots i{font-style:normal;font-size:10px;font-weight:700;color:var(--on,#fff);background:var(--c);border-radius:999px;padding:1px 7px}
.search{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search input{max-width:340px}
.fx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:20px;align-items:start}
@media (max-width:900px){.fx{grid-template-columns:minmax(0,1fr)}}
ol.plays{margin:0;padding:0;list-style:none;counter-reset:p;display:grid;gap:12px}
ol.plays li{counter-increment:p;display:grid;grid-template-columns:30px 1fr;gap:10px}
ol.plays li::before{content:counter(p);width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
ol.plays b{color:var(--ink);display:block}
.say{background:var(--band);border-radius:10px;padding:14px 16px;color:var(--ink);font-size:15px;line-height:1.55;font-style:italic}
.walk{border-left:4px solid var(--muted);padding:8px 12px;color:var(--body);font-size:14px}
.stuck{display:grid;gap:6px}
.stuck a{text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--ink);font-size:14px;display:flex;justify-content:space-between;gap:8px}
.stuck a:hover{border-color:var(--navy)}
.stuck a span{color:var(--navy)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="inner">
  <a class="brand" href="#"><span>The 7 Steps to Win</span><span class="tag">Manager</span></a>
  <nav class="stepper" id="stepper" aria-label="Steps"></nav>
  <div class="tools">
    <a class="tbtn" href="#doctor">Deal Doctor</a>
    <a class="tbtn" href="#team-check">Team Check</a>
    <a class="tbtn" href="#funnel">Funnel</a>
  </div>
</div></header>

<main class="inner" id="app"></main>

<script>
const team=()=>S.names||[];
const ROLES=["SDR","BTSS","BSS","BTS","TSS"];

const STEPS=[
{id:"find",num:"1",sub:"1A · Outbound",name:"Find",c:"#436B2B",roles:"SDR BTSS BSS TSS",
 seller:"Build a quality list of the right accounts and people.",metric:"Connect rate",mq:"Are we creating conversations?",
 mgr:"Make sure the list is worth calling. Low connect rates are usually a list problem before they are a skill problem.",
 inspect:[["Accounts fit the territory and ICP","Right segment, industry and size"],["Personas named for each account","Titles that own the problem we solve"],["A reason to call now for the top accounts","Trigger, news, hiring, initiative"],["Contact data checked","Direct dials and emails that connect"]],
 qs:["Show me your top 20 accounts this week. Why these 20?","Which persona are you going after, and what do they own?","What trigger makes this account worth a call right now?","Where is your contact data coming from, and how fresh is it?"],
 flags:["List pulled with no filters","Same accounts as last month with no new angle","Contacts with titles that can't feel the pain","Connect rate falling while dials stay flat"],
 step:["Build the list with new sellers in week one","Review ICP filters and territory intel together","Share account plays and triggers in team meeting"]},
{id:"respond",num:"1",sub:"1B · Inbound",name:"Respond",c:"#1837A3",roles:"SDR",sm:true,
 seller:"Work every inbound lead fast, before a competitor does.",metric:"Speed to lead",mq:"Are we responding within an hour?",
 mgr:"Watch the clock. Inbound leads cool fast, and an hour lost is often the deal lost.",
 inspect:[["Every new lead touched within the hour",""],["Multi-touch follow-up in place","Call, email and LinkedIn, not one email"],["First touch references what they engaged with",""],["Aged leads closed out or reassigned",""]],
 qs:["How fast did you touch your last five inbound leads?","What did you say on the first touch?","How many attempts before you stop, and over how many days?","What happened to the leads that went quiet?"],
 flags:["Leads untouched for more than a day","One attempt and done","Generic reply that ignores what they asked for","Queue growing with no owner"],
 step:["Spot check the lead queue daily","Set alerts so leads route instantly","Reassign aged leads instead of letting them sit"]},
{id:"reach-out",num:"2",name:"Reach Out",c:"#1837A3",roles:"SDR BTSS BSS TSS",
 seller:"Call, email and message with a relevant reason to talk.",metric:"Meeting rate",mq:"Conversations to meetings",
 mgr:"Listen to the calls. High connects with low meetings means the opener or the objection handling is breaking.",
 inspect:[["Calls are recorded",""],["Opener gives a relevant reason to talk","Specific to the account or persona"],["Top objections have a practiced answer",""],["AI feedback on recent calls reviewed by the seller",""]],
 qs:["Play me your opener like I'm the prospect.","What reason to talk did you give on your last booked meeting?","Which objection is costing you the most meetings?","What did the AI feedback flag on your last few calls?"],
 flags:["Pitching in the first 30 seconds","Calls not recorded","Same message for every persona","Plenty of conversations, few meetings"],
 step:["Review one recording per seller each week","Role-play the top objection in the 1:1","Run a team call block and debrief together"]},
{id:"discover",num:"3",name:"Discover",c:"#E3A32D",on:"#2B1D00",roles:"SDR BTSS BSS TSS",
 seller:"Have a short first conversation. Understand what they care about and whether there is a reason to keep talking.",metric:"2nd meeting rate",mq:"Do they want to continue?",
 mgr:"Coach listening. A strong discovery ends with the client asking for the next meeting, not the seller asking for it.",
 inspect:[["Seller talked less than half the call",""],["Client priorities captured in their words",""],["Next meeting on the calendar before the call ended",""],["Recap sent the same day","With a second stakeholder invited"]],
 qs:["What do they care about, in their words?","Why would they want a second meeting?","What question would you cut next time, and what would you add?","Who else needs to be in meeting two?"],
 flags:["Demo in the first call","No next step booked","Seller did most of the talking","No recap sent"],
 step:["Listen to discovery recordings and score them together","Join first discovery calls for newer sellers","Practice the up-front agenda in the 1:1"]},
{id:"engage",num:"4",name:"Engage",c:"#6544A3",roles:"BTSS BSS BTS TSS",
 seller:"Share opportunity with the right business partners. Understand the problem, value, and solution.",metric:"Meetings to oppty rate",mq:"Are conversations becoming pipeline?",
 mgr:"Turn good meetings into real pipeline. Check that the problem, value and solution are written down, and that the right partners and technical people are in.",
 inspect:[["Opportunity created with the problem stated",""],["Value described in the client's terms","Time, cost, risk or revenue"],["Solution direction agreed",""],["Right business partner and technical seller engaged",""]],
 qs:["Give me the problem, the value and the solution in one sentence each.","Which business partner fits this, and have you talked to them?","Who on the technical side needs to see this?","Why is this pipeline and not just a good conversation?"],
 flags:["Meetings happening but no opps created","Opp with a blank or generic problem","Partner brought in late","Technical deal with no technical seller"],
 step:["Broker the business partner introduction","Get technical resources assigned","Review opportunity hygiene weekly"]},
{id:"qualify",num:"5",name:"Qualify",c:"#DE6723",roles:"BTSS BSS BTS TSS",
 seller:"Move to QP when there is a real opportunity and evidence the client intends to move forward.",metric:"Engaged to QP",mq:"Are we turning engaged prospects into qualified opportunities?",
 mgr:"QP is a promise to your forecast. Ask for evidence the client intends to move, and make qualifying out feel like a win.",

const KEY="flm7-v2";
let S={role:"All",fwho:"Team",funnel:{},targets:{},team:{},checks:{},names:[]};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)S=Object.assign(S,s);}catch(e){}

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byId=id=>STEPS.find(s=>s.id===id);
const cvars=s=>`--c:${s.c};--on:${s.on||"#fff"}`;

function funnelData(){const f=S.funnel[S.fwho];return f?{nums:f,example:false}:{nums:EXAMPLE,example:true};}
function rateRows(){
  const {nums}=funnelData();
  return RATES.map(r=>{const a=+nums[r.from]||0,b=+nums[r.to]||0,v=a?Math.round(b/a*100):null,t=+(S.targets[r.step]??r.target);
    let st="mid";if(v===null)st="";else if(v>=t)st="good";else if(v<t*.7)st="bad";
    return {...r,v,t,st,gapPct:v===null?0:(t-v)/t};});
}
function weakest(){const rows=rateRows().filter(r=>r.v!==null&&r.v<r.t);rows.sort((a,b)=>b.gapPct-a.gapPct);return rows[0];}

function renderStepper(active){
  $("stepper").innerHTML=STEPS.filter(s=>!s.sm).map(s=>`<a class="sp ${active===s.id?"on":""}" href="#${s.id}" style="${cvars(s)}"><b>${s.num}</b>${esc(s.name)}</a>`).join("");
}

  <section class="cards">
    ${STEPS.map(s=>`<a class="card ${roleOn(s)?"":"dim"}" href="#${s.id}" style="${cvars(s)}">
      <span class="num">${s.num}</span>
      ${s.sub?`<span class="sub">${esc(s.sub)}</span>`:""}
      <span class="name">${esc(s.name)}</span>
      <span class="desc">${esc(s.mgr.split(". ")[0])}.</span>
      ${w&&w.step===s.id?`<span class="gap">Team gap</span>`:""}
      <span class="metric"><span class="lbl">Watch</span><span class="m">${esc(s.metric)}</span><span class="q">${esc(s.mq)}</span></span>
      <span class="open">Open coaching guide →</span></a>`).join("")}
  </section>
  <section class="band"><div class="b1">Create · Prepare → Engage</div><div class="b2">Progress · Qualify → Design → Propose → Negotiate</div><div class="b3">Close</div></section>
  <section class="panel"><div class="panel-head"><div><span class="lbl">Deal Doctor</span><h2>Deal stuck? Start with the symptom.</h2><p>Prescriptive fixes for the ${SC.length} situations that stall deals most often.</p></div><a class="tbtn" href="#doctor">Search all scenarios →</a></div>
    <div class="sym">${SC.slice(0,9).map(symTile).join("")}</div></section>
  ${funnelPanel()}
  <div class="duo">
    <section class="panel"><div class="panel-head"><div><h2>Team Check</h2><p>Rate each seller on each step. See who needs coaching where, and which step the whole team should train on next.</p></div></div>
      ${teamSummary()}
      <div><a class="btn" href="#team-check" style="display:inline-block;text-decoration:none">Open Team Check</a></div></section>
    <section class="panel"><div class="panel-head"><div><h2>A week in the life of a manager</h2><p>What a strong coaching week looks like.</p></div></div>
      <div class="week" style="grid-template-columns:1fr 1fr">${weekCards()}</div></section>
  </div>
  <footer><span>Manager companion to the 7 Steps to Win</span><span>Your entries are saved in this browser only</span></footer>`;
}

function weekCards(){return [
 ["Monday","Pipeline review","Every seller. One question per deal: what changed since last week, and what proves it?"],
 ["Tue to Wed","Deal inspections","Top three deals per seller, run against the step's inspect list."],
 ["Weekly 1:1","Call coaching","Listen to one recording first. Coach one habit, then check it next week."],
 ["Thursday","Forecast","Commit only deals with a signer, a date and a route to buy."]
].map(w=>`<div class="wk"><span class="lbl">${w[0]}</span><h3>${w[1]}</h3><p>${w[2]}</p></div>`).join("");}

function funnelPanel(){
  const {nums,example}=funnelData(),rows=rateRows(),w=weakest();
  return `<section class="panel" id="funnel">
   <div class="panel-head"><div><h2>Where is the funnel breaking?</h2><p>Enter weekly counts for the team or one seller. Each conversion maps to a step, so the biggest gap tells you which coaching guide to open.</p></div>
     <div style="min-width:220px"><label class="lbl" for="fwho">Showing</label><select id="fwho">${["Team",...team()].map(n=>`<option ${S.fwho===n?"selected":""}>${esc(n)}</option>`).join("")}</select></div></div>
   ${example?`<p class="lbl" style="color:var(--build)">Example numbers. Type your own to replace them.</p>`:""}
   <div class="funnel">${FUN.map(f=>`<div class="fbox"><label for="f-${f.k}">${f.label}</label><input type="number" min="0" id="f-${f.k}" data-k="${f.k}" value="${nums[f.k]??""}"></div>`).join("")}</div>
   <div class="conv"><table><thead><tr><th>Step</th><th>Conversion</th><th>Rate</th><th>Target %</th><th>vs target</th><th></th></tr></thead><tbody>
   ${rows.map(r=>{const s=byId(r.step);return `<tr style="${cvars(s)}"><td><a href="#${s.id}">${s.num} · ${esc(s.name)}</a></td><td>${r.name}</td><td class="n">${r.v===null?"·":r.v+"%"}</td>
     <td><input type="number" min="0" max="100" id="t-${r.step}" data-t="${r.step}" value="${r.t}" aria-label="Target for ${r.name}"></td>
     <td><div class="bar"><i style="width:${Math.min(100,r.v||0)}%"></i><u style="left:${Math.min(100,r.t)}%"></u></div></td>
     <td>${r.st?`<span class="st ${r.st}">${r.st==="good"?"On target":r.st==="mid"?"Close":"Fix here"}</span>`:""}</td></tr>`;}).join("")}
   </tbody></table></div>
   ${w?`<div class="callout">Biggest gap for ${esc(S.fwho==="Team"?"the team":S.fwho)}: <b>${w.name}</b> at ${w.v}% against a ${w.t}% target. Start with the <a href="#${w.step}">${esc(byId(w.step).name)} coaching guide</a>.</div>`:""}
   <p class="lbl">Targets are yours to set. The defaults are placeholders.</p>
  </section>`;
}

const LV=["Not rated","Focus","Building","Strong"];
const MAIN=STEPS.filter(s=>!s.sm);
function teamSummary(){
  const counts=MAIN.map(s=>({s,n:team().filter(p=>(S.team[p]||{})[s.id]===1).length}));
  const rated=team().some(p=>Object.keys(S.team[p]||{}).length);
  if(!team().length)return `<p style="color:var(--muted)">Add your sellers, then rate each one by step. The step where most of your team needs focus becomes your next team training topic.</p>`;
  if(!rated)return `<p style="color:var(--muted)">No ratings yet. Rate your sellers and the step with the most "Focus" ratings shows up here as your next team training topic.</p>`;
  counts.sort((a,b)=>b.n-a.n);const top=counts[0];
  return top.n?`<div class="callout" style="border-color:var(--navy);background:var(--band)">Team training topic: <a href="#${top.s.id}">${esc(top.s.name)}</a>. ${top.n} of ${team().length} sellers are rated Focus there.</div>`:`<p>No sellers rated Focus yet.</p>`;
}
function teamPage(){
  return `<section class="hero"><span class="lbl">Team Check</span><h1>Who needs coaching where?</h1>
   <p>Tap a cell to cycle Focus, Building and Strong. Use this the way sellers use their Readiness Check, but from your view of their calls and deals.</p>
   <div class="legend"><span class="st bad">Focus</span><span class="st mid">Building</span><span class="st good">Strong</span></div></section>
  <section class="panel">
   <form class="search" id="addForm"><input type="text" id="newName" placeholder="Add a seller's name" aria-label="Seller name"><button class="btn" type="submit">Add seller</button></form>
   ${team().length?teamSummary():`<p style="color:var(--muted)">Add your sellers above. Names are saved in your browser only, so each manager builds their own team.</p>`}
   ${team().length?`<div class="tc"><table><thead><tr><th>Seller</th>${MAIN.map(s=>`<th class="stp"><a href="#${s.id}">${s.num} ${esc(s.name)}</a></th>`).join("")}<th class="stp">Coach next</th></tr></thead><tbody>
   ${team().map(p=>{const r=S.team[p]||{};const f=MAIN.find(s=>r[s.id]===1);
     return `<tr><td><button type="button" class="rm" data-rm="${esc(p)}" aria-label="Remove ${esc(p)}">×</button> ${esc(p)}</td>${MAIN.map(s=>{const v=r[s.id]||0;return `<td><button type="button" class="cell s${v}" data-p="${esc(p)}" data-s="${s.id}">${LV[v]}</button></td>`;}).join("")}
     <td>${f?`<a href="#${f.id}">${esc(f.name)}</a>`:`<span style="color:var(--muted)">·</span>`}</td></tr>`;}).join("")}
   </tbody></table></div>
   <div><button class="btn ghost" id="clearTeam" type="button">Clear ratings</button></div>`:""}</section>`;
}

function stepPage(s){
  const ck=S.checks[s.id]||[],c=s.inspect.filter((_,i)=>ck[i]).length,n=s.inspect.length,i=STEPS.indexOf(s);
  const v=c===0?["Not inspected",""]:c===n?["Ready to advance","good"]:c/n>=.6?["Hold here","mid"]:["At risk","bad"];
  const prev=STEPS[i-1],next=STEPS[i+1];
  return `
  <section class="shead" style="${cvars(s)}">
    <div class="row"><span class="num">${s.num}</span><div><span class="lbl">${s.sub?esc(s.sub)+" · ":""}Step ${s.num} coaching guide · ${s.roles.split(" ").join(", ")}</span><h1>${esc(s.name)}</h1></div></div>
    <div class="kv">
      <div><span class="lbl">Seller's job</span><p>${esc(s.seller)}</p></div>
      <div><span class="lbl">Your job</span><p>${esc(s.mgr)}</p></div>
      <div><span class="lbl">Metric to watch</span><p><b>${esc(s.metric)}</b><br><span style="color:var(--muted)">${esc(s.mq)}</span></p></div>
    </div>
  </section>
  <div class="sgrid">
    <div style="display:grid;gap:20px">
      <section class="panel"><div><h2>Coaching questions</h2><p style="color:var(--muted);font-size:14px;margin-top:4px">Ask these in the 1:1 or deal review. Tap to copy.</p></div>
        <div class="stack">${s.qs.map(q=>`<button class="qbtn" type="button"><span>${esc(q)}</span><span>COPY</span></button>`).join("")}</div></section>
      <div class="duo">
        <section class="panel"><h3>Red flags</h3><ul class="list flags">${s.flags.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></section>
        <section class="panel"><h3>When you step in</h3><ul class="list steps">${s.step.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></section>
      </div>
    </div>
    <div style="display:grid;gap:20px">
    <section class="panel" aria-label="Stuck at this step">
      <div><span class="lbl">Deal Doctor</span><h2>Stuck at ${esc(s.name)}?</h2><p style="color:var(--muted);font-size:14px;margin-top:4px">Pick what's happening for a prescriptive fix.</p></div>
      <div class="stuck">${scForStep(s.id).map(x=>`<a href="#fix-${x.id}">${esc(x.t)}<span>→</span></a>`).join("")||`<p style="color:var(--muted)">No scenarios yet.</p>`}</div>
    </section>
    <section class="panel" aria-label="Ready for the next step">
      <div><span class="lbl">Walk a deal through it</span><h2>Ready for the next step?</h2><p style="color:var(--muted);font-size:14px;margin-top:4px">Use in deal review. Ask the seller to show the evidence, not describe it.</p></div>
      <div class="stack" style="gap:2px">${s.inspect.map((e,k)=>`<label class="check"><input type="checkbox" id="ck-${s.id}-${k}" data-k="${k}" ${ck[k]?"checked":""}><span>${esc(e[0])}${e[1]?`<small>${esc(e[1])}</small>`:""}</span></label>`).join("")}</div>
      <div class="score"><span class="big">${c}/${n}</span>${v[1]?`<span class="st ${v[1]}">${v[0]}</span>`:`<span class="lbl">${v[0]}</span>`}<button class="btn ghost" id="clearDeal" type="button" style="margin-left:auto;padding:6px 12px;font-size:13px">Reset</button></div>
    </section>
    </div>
  </div>
  <div class="nav2">${prev?`<a class="tbtn" href="#${prev.id}">← ${esc(prev.name)}</a>`:`<a class="tbtn" href="#">← All steps</a>`}${next?`<a class="tbtn" href="#${next.id}">${esc(next.name)} →</a>`:`<a class="tbtn" href="#">All steps →</a>`}</div>`;
}

function doctorPage(){
  const q=(S.dq||"").toLowerCase(),f=S.dstep||"All";
  const list=SC.filter(x=>(f==="All"||x.steps.includes(f))&&(!q||(x.t+" "+x.sym).toLowerCase().includes(q)));
  return `<section class="hero"><span class="lbl">Deal Doctor</span><h1>What's going wrong on the deal?</h1>
    <p>Pick the symptom. Get the questions to ask your seller, the plays to try in order, a talk track they can use today, your move as their manager, and when to walk away.</p></section>
   <section class="panel">
    <div class="search"><input type="text" id="dq" placeholder="Search: budget, ghosted, competitor, procurement..." value="${esc(S.dq||"")}" aria-label="Search scenarios">
      <div class="chips">${["All",...MAIN.map(s=>s.id)].map(id=>{const s=byId(id);return `<button class="chip ${f===id?"on":""}" data-df="${id}" type="button">${s?s.num+" "+esc(s.name):"All steps"}</button>`;}).join("")}</div></div>
    <div class="sym">${list.map(symTile).join("")||`<p style="color:var(--muted)">Nothing matches. Try another word.</p>`}</div>
   </section>`;
}
function symTile(x){return `<a class="symt" href="#fix-${x.id}"><b>${esc(x.t)}</b><span>${esc(x.sym)}</span><span class="dots">${x.steps.map(id=>{const s=byId(id);return `<i style="${cvars(s)}">${s.num} ${esc(s.name)}</i>`;}).join("")}</span></a>`;}

function fixPage(x){
  const ck=(S.fixck||{})[x.id]||[];
  return `<a class="tbtn" href="#doctor" style="justify-self:start">← All scenarios</a>
  <section class="shead" style="--c:var(--navy)">
    <span class="lbl">Deal Doctor</span><h1 style="text-transform:none;letter-spacing:0">${esc(x.t)}</h1>
    <p style="color:var(--ink);font-size:16px">${esc(x.sym)}</p>
    <span class="dots">${x.steps.map(id=>{const s=byId(id);return `<a href="#${s.id}" style="text-decoration:none"><i style="${cvars(s)}">${s.num} ${esc(s.name)}</i></a>`;}).join("")}</span>
  </section>
  <div class="fx">
    <div style="display:grid;gap:20px">
      <section class="panel"><div><span class="lbl">Diagnose first</span><h2>Ask the seller</h2><p style="color:var(--muted);font-size:14px;margin-top:4px">Check off what they've already done. What's left is where to start.</p></div>
        <div class="stack" style="gap:2px">${x.ask.map((a,k)=>`<label class="check"><input type="checkbox" id="fx-${x.id}-${k}" data-k="${k}" ${ck[k]?"checked":""}><span>${esc(a)}</span></label>`).join("")}</div></section>
      <section class="panel"><h3>Your move as their manager</h3><ul class="list steps">${x.you.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
        ${x.walk?`<div class="walk"><span class="lbl">When to walk away</span><br>${esc(x.walk)}</div>`:""}</section>
    </div>
    <div style="display:grid;gap:20px">
      <section class="panel"><div><span class="lbl">Prescription</span><h2>Try these, in order</h2></div>
        <ol class="plays">${x.plays.map(p=>`<li><div><b>${esc(p[0])}</b>${esc(p[1])}</div></li>`).join("")}</ol></section>
      <section class="panel"><div><span class="lbl">Talk track</span><h2>Say it like this</h2></div>
        <div class="say">${esc(x.say)}</div>
        <div class="chips"><button class="btn ghost" id="copySay" type="button">Copy talk track</button><button class="btn" id="copyPlan" type="button">Copy coaching plan</button></div>
        <div class="toast" id="toast"></div></section>
    </div>
  </div>
  <section class="panel"><h3>Related scenarios</h3><div class="sym">${SC.filter(o=>o.id!==x.id&&o.steps.some(s=>x.steps.includes(s))).slice(0,6).map(symTile).join("")}</div></section>`;
}
function planText(x){
  const ck=(S.fixck||{})[x.id]||[],open=x.ask.filter((_,k)=>!ck[k]);
  return [`COACHING PLAN: ${x.t}`,``,`Check these first:`,...(open.length?open:x.ask).map(a=>`- ${a}`),``,`Try these, in order:`,...x.plays.map((p,i)=>`${i+1}. ${p[0]}: ${p[1]}`),``,`Say it like this:`,x.say,
   ...(x.walk?[``,`When to walk away: ${x.walk}`]:[])].join("\n");
}
function bindDoctor(){
  const dq=$("dq");dq.oninput=()=>{S.dq=dq.value;save();const pos=dq.selectionStart;$("app").innerHTML=doctorPage();bindDoctor();const n=$("dq");n.focus();n.setSelectionRange(pos,pos);};
  document.querySelectorAll("[data-df]").forEach(b=>b.onclick=()=>{S.dstep=b.dataset.df;save();$("app").innerHTML=doctorPage();bindDoctor();});
}
function bindFix(x){
  document.querySelectorAll(".check input").forEach(cb=>cb.onchange=()=>{S.fixck=S.fixck||{};const a=S.fixck[x.id]||(S.fixck[x.id]=[]);a[+cb.dataset.k]=cb.checked;save();});
  $("copySay").onclick=()=>copy(x.say,()=>toast("Talk track copied"),()=>toast("Copy blocked. Select the text instead."));
  $("copyPlan").onclick=()=>copy(planText(x),()=>toast("Coaching plan copied. Paste it to your seller."),()=>toast("Copy blocked. Select the text instead."));
}

function toast(t){const el=$("toast");if(!el)return;el.textContent=t;setTimeout(()=>{if(el)el.textContent="";},1800);}
function copy(text,ok,fail){try{navigator.clipboard.writeText(text).then(ok,fail);}catch(e){fail&&fail();}}

function route(){
  const h=(location.hash||"").slice(1);const s=byId(h);const app=$("app");
  renderStepper(s?s.id:"");
  if(s){app.innerHTML=stepPage(s);bindStep(s);window.scrollTo(0,0);}
  else if(h==="team-check"){app.innerHTML=teamPage();bindTeam();window.scrollTo(0,0);}
  else if(h==="doctor"){app.innerHTML=doctorPage();bindDoctor();window.scrollTo(0,0);}
  else if(h.startsWith("fix-")&&scById(h.slice(4))){const x=scById(h.slice(4));app.innerHTML=fixPage(x);bindFix(x);window.scrollTo(0,0);}
  else{app.innerHTML=home();bindHome();if(h==="funnel"){const f=$("funnel");f&&f.scrollIntoView();}}
}

function bindHome(){
  document.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{S.role=b.dataset.role;save();route();});
  bindFunnel();
}
function refreshFunnel(){const old=$("funnel");const tmp=document.createElement("div");tmp.innerHTML=funnelPanel();old.replaceWith(tmp.firstElementChild);bindFunnel();
  // keep the team-gap chip on cards in sync
  const w=weakest();document.querySelectorAll(".card").forEach(c=>{const g=c.querySelector(".gap");const id=c.getAttribute("href").slice(1);if(g)g.remove();if(w&&w.step===id){const sp=document.createElement("span");sp.className="gap";sp.textContent="Team gap";c.querySelector(".metric").before(sp);}});}
function bindFunnel(){
  $("fwho").onchange=e=>{S.fwho=e.target.value;save();refreshFunnel();};
  document.querySelectorAll("[data-k]").forEach(inp=>inp.onchange=()=>{const cur=Object.assign({},funnelData().nums);cur[inp.dataset.k]=inp.value===""?"":+inp.value;S.funnel[S.fwho]=cur;save();refreshFunnel();});
  document.querySelectorAll("[data-t]").forEach(inp=>inp.onchange=()=>{S.targets[inp.dataset.t]=+inp.value;save();refreshFunnel();});
}
function bindTeam(){
  document.querySelectorAll(".cell").forEach(b=>b.onclick=()=>{const p=b.dataset.p,id=b.dataset.s;const r=S.team[p]||(S.team[p]={});r[id]=((r[id]||0)+1)%4;save();
    const y=window.scrollY;$("app").innerHTML=teamPage();bindTeam();window.scrollTo(0,y);
    const nb=document.querySelector(`.cell[data-p="${CSS.escape(p)}"][data-s="${id}"]`);nb&&nb.focus();});
  const ct=$("clearTeam");if(ct)ct.onclick=()=>{S.team={};save();route();};
  $("addForm").onsubmit=e=>{e.preventDefault();const v=$("newName").value.trim();if(v&&!team().includes(v)){S.names=[...team(),v];save();}$("app").innerHTML=teamPage();bindTeam();$("newName").focus();};
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const p=b.dataset.rm;S.names=team().filter(n=>n!==p);delete S.team[p];if(S.fwho===p)S.fwho="Team";save();$("app").innerHTML=teamPage();bindTeam();});
}
function bindStep(s){
  document.querySelectorAll(".check input").forEach(cb=>cb.onchange=()=>{const a=S.checks[s.id]||(S.checks[s.id]=[]);a[+cb.dataset.k]=cb.checked;save();
    const y=window.scrollY;route();window.scrollTo(0,y);});
  document.querySelectorAll(".qbtn").forEach(b=>b.onclick=()=>{const t=b.firstElementChild.textContent;copy(t,()=>{b.classList.add("copied");b.lastElementChild.textContent="COPIED";setTimeout(()=>{b.classList.remove("copied");b.lastElementChild.textContent="COPY";},1400);});});
  $("clearDeal").onclick=()=>{S.checks[s.id]=[];save();const y=window.scrollY;route();window.scrollTo(0,y);};
}
window.addEventListener("hashchange",route);
route();
</script>

</body>
</html>
